AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM role that GitHub Actions assumes to deploy the D&D Tracker, using GitHub's
  OIDC provider. This means no long-lived AWS access keys are ever stored in
  GitHub secrets.

  Kept in its own stack because the OIDC provider is account-wide: if another
  project in this account already created it, set CreateOIDCProvider to false.

Parameters:
  GitHubRepo:
    Type: String
    Default: johangaw/dnd-tracker
    Description: The owner/repo allowed to assume this role.
  GitHubBranch:
    Type: String
    Default: main
    Description: Only this branch may deploy.
  SiteStackName:
    Type: String
    Default: dnd-tracker-site
    Description: Name of the hosting stack, used to scope the role's permissions.
  AppName:
    Type: String
    Default: dnd-tracker
    Description: Must match the AppName used in template.yaml - it determines the bucket name.
  CreateOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if this account already has the GitHub OIDC provider.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates GitHub's certificate chain against its own trust store,
      # so this thumbprint is no longer the security boundary it used to be,
      # but the field is still required.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOIDCProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Pinned to one branch of one repo. Without this condition any
                # GitHub repository in the world could assume the role.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: DeploySite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadStackOutputs
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*'
              - Sid: SyncSiteFiles
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${AppName}-site-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${AppName}-site-${AWS::AccountId}/*'
              - Sid: InvalidateCache
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'

Outputs:
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE secret (or variable) in GitHub
    Value: !GetAtt DeployRole.Arn
