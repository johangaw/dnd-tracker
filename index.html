<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>D&D Encounter Tracker</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="app-header-row">
                <button id="back-btn" class="icon-btn hidden" aria-label="Back">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <h1 id="page-title">Encounters</h1>
                <button id="menu-btn" class="icon-btn hidden" aria-label="Menu">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            </div>
            <nav class="main-nav" aria-label="Primary navigation">
                <button class="nav-item active" id="menu-encounters" data-nav="encounters" type="button" aria-label="Encounters">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13zm3 2.5h10v2H7V8zm0 4h7v2H7v-2zm0 4h10v2H7v-2z"/></svg>
                    <span>Encounters</span>
                </button>
                <button class="nav-item" id="menu-custom-monsters" data-nav="custom-monsters" type="button" aria-label="Custom Monsters">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2 4 6v6c0 4.42 2.88 8.53 8 10 5.12-1.47 8-5.58 8-10V6l-8-4zm0 2.18 5.6 2.8L12 9.8 6.4 7l5.6-2.82zm-6 4.4 5 2.5v6.48c-3.15-1.07-5-3.78-5-6.53v-2.45zm6 8.98v-6.48l5-2.5v2.45c0 2.75-1.85 5.46-5 6.53z"/></svg>
                    <span>Monsters</span>
                </button>
                <button class="nav-item" id="menu-characters" data-nav="characters" type="button" aria-label="Characters">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 1a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.67 0-8 1.34-8 4v1h10v-1c0-.97.46-1.89 1.25-2.67A7.18 7.18 0 0 0 8 14zm8 0c2.31 0 5.47.89 7 2.6V18h-8v-1c0-1.06.12-2.04.34-2.86A8.36 8.36 0 0 1 16 14z"/></svg>
                    <span>Characters</span>
                </button>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Encounter List View -->
            <encounter-list-view id="encounter-list-view" class="view active"></encounter-list-view>

            <!-- Encounter Edit View -->
            <encounter-edit-view id="encounter-edit-view" class="view"></encounter-edit-view>

            <!-- Encounter Run View -->
            <encounter-run-view id="encounter-run-view" class="view"></encounter-run-view>

            <!-- Custom Monsters View -->
            <custom-monsters-view id="custom-monsters-view" class="view"></custom-monsters-view>

            <!-- Custom Monster Edit View -->
            <custom-monster-edit-view id="custom-monster-edit-view" class="view"></custom-monster-edit-view>

            <!-- Characters List View -->
            <characters-view id="characters-view" class="view"></characters-view>

            <!-- Character View (Read-only) -->
            <character-view id="character-view-section" class="view"></character-view>

            <!-- Character Edit View -->
            <character-edit-view id="character-edit-view" class="view"></character-edit-view>

            <!-- Monster Stat Block Modal -->
            <div id="stat-block-modal" class="modal">
                <div class="modal-content modal-large">
                    <div class="modal-header">
                        <h2 id="stat-block-name">Monster Name</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div id="stat-block-content" class="stat-block"></div>
                    </div>
                </div>
            </div>

            <!-- Spell Modal -->
            <div id="spell-modal" class="modal">
                <div class="modal-content modal-large">
                    <div class="modal-header">
                        <h2 id="spell-modal-name">Spell Name</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div id="spell-modal-content" class="spell-block"></div>
                    </div>
                </div>
            </div>

            <!-- HP Adjustment Modal -->
            <div id="hp-modal" class="modal">
                <div class="modal-content modal-small">
                    <div class="modal-header">
                        <h2 id="hp-modal-title">Adjust HP</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <!-- Instance selector for grouped monsters -->
                        <div id="hp-instance-selector" class="instance-selector hidden"></div>
                        <div class="hp-display">
                            <span id="current-hp">0</span> / <span id="max-hp">0</span>
                            <span id="hp-temp-display" class="hp-temp-display hidden">+<span id="hp-temp-value">0</span> temp</span>
                        </div>
                        <!-- Character-only fields (hidden for monsters) -->
                        <div id="hp-character-fields" class="hp-character-fields hidden">
                            <div class="hp-field-row">
                                <div class="hp-field">
                                    <label for="hp-temp-input">Temp HP</label>
                                    <input type="number" id="hp-temp-input" min="0" value="0">
                                </div>
                                <div class="hp-field">
                                    <label for="hp-max-reduction">Max HP Reduction</label>
                                    <input type="number" id="hp-max-reduction" min="0" value="0">
                                </div>
                            </div>
                        </div>
                        <div class="hp-input-row">
                            <input type="number" id="hp-custom-amount" placeholder="0" value="0">
                            <span id="hp-preview" class="hp-preview hidden">= <span id="hp-preview-value">0</span></span>
                        </div>
                        <div class="hp-controls">
                            <button type="button" class="hp-adj-btn damage" data-amount="-10">-10</button>
                            <button type="button" class="hp-adj-btn damage" data-amount="-5">-5</button>
                            <button type="button" class="hp-adj-btn damage" data-amount="-1">-1</button>
                            <button type="button" class="hp-adj-btn heal" data-amount="1">+1</button>
                            <button type="button" class="hp-adj-btn heal" data-amount="5">+5</button>
                            <button type="button" class="hp-adj-btn heal" data-amount="10">+10</button>
                        </div>
                        <div class="hp-actions">
                            <button type="button" id="hp-reset-btn" class="btn btn-small">Reset</button>
                            <button type="button" id="hp-apply-btn" class="btn btn-primary">Apply</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Encounter Monsters Quick Add Modal -->
            <div id="encounter-monsters-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Add from Encounter</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p class="modal-hint">Tap a monster to add one instance to combat</p>
                        <div id="encounter-monsters-list" class="search-results"></div>
                    </div>
                </div>
            </div>

            <!-- Combat Monster Search Modal -->
            <div id="combat-monster-search-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Add Monster to Combat</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="search-box">
                            <input type="text" id="combat-monster-search-input" placeholder="Search by name...">
                            <select id="combat-monster-source-filter">
                                <option value="" selected>Default</option>
                                <option value="ALL">All Sources</option>
                                <option value="Custom">Custom Monsters</option>
                                <option value="XMM">Monster Manual (2024)</option>
                                <option value="MM">Monster Manual (2014)</option>
                            </select>
                        </div>
                        <div class="quantity-selector">
                            <label>Quantity:</label>
                            <button type="button" class="qty-btn" id="qty-decrease">-</button>
                            <span id="monster-quantity">1</span>
                            <button type="button" class="qty-btn" id="qty-increase">+</button>
                        </div>
                        <div id="combat-monster-search-results" class="search-results"></div>
                    </div>
                </div>
            </div>

            <!-- Add PC to Combat Modal -->
            <div id="combat-pc-modal" class="modal">
                <div class="modal-content modal-small">
                    <div class="modal-header">
                        <h2>Add PC to Combat</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="combat-pc-name">Character Name</label>
                            <input type="text" id="combat-pc-name" placeholder="Enter name...">
                        </div>
                        <div class="form-group">
                            <label for="combat-pc-initiative">Initiative</label>
                            <input type="number" id="combat-pc-initiative" placeholder="0">
                        </div>
                        <button type="button" id="add-combat-pc-confirm" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Add PC</button>
                    </div>
                </div>
            </div>

            <!-- Initiative Edit Modal -->
            <div id="initiative-modal" class="modal">
                <div class="modal-content modal-small">
                    <div class="modal-header">
                        <h2 id="initiative-modal-title">Edit Initiative</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="initiative-input">Initiative</label>
                            <input type="number" id="initiative-input" placeholder="0">
                        </div>
                        <button type="button" id="save-initiative-btn" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Save</button>
                    </div>
                </div>
            </div>

            <!-- Import Encounter Modal -->
            <div id="import-modal" class="modal">
                <div class="modal-content modal-small">
                    <div class="modal-header">
                        <h2>Import Encounter</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p id="import-encounter-info"></p>
                        <div class="form-actions" style="margin-top: 16px;">
                            <button type="button" id="import-cancel-btn" class="btn">Cancel</button>
                            <button type="button" id="import-confirm-btn" class="btn btn-primary">Import</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Import Monster Modal (from URL) -->
            <div id="import-monster-modal" class="modal">
                <div class="modal-content modal-small">
                    <div class="modal-header">
                        <h2>Import Monster</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p id="import-monster-info"></p>
                        <div class="form-actions" style="margin-top: 16px;">
                            <button type="button" id="import-monster-cancel-btn" class="btn">Cancel</button>
                            <button type="button" id="import-monster-confirm-btn" class="btn btn-primary">Import</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- App Menu (Navigation Dropdown) -->
            <div id="app-menu" class="app-menu hidden">
                <button class="app-menu-item" id="menu-encounters">Encounters</button>
                <button class="app-menu-item" id="menu-characters">Characters</button>
                <button class="app-menu-item" id="menu-custom-monsters">Custom Monsters</button>
            </div>

            <!-- Add Encounter Choice Modal -->
            <div id="add-encounter-choice-modal" class="modal">
                <div class="modal-content modal-small">
                    <div class="modal-header">
                        <h2>Add Encounter</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="choice-buttons">
                            <button type="button" id="encounter-choice-create-new" class="btn btn-large">
                                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                                Create New
                            </button>
                            <button type="button" id="encounter-choice-import-json" class="btn btn-large">
                                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                                Import JSON
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Import Encounter JSON Modal -->
            <div id="import-encounter-json-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Import Encounter from JSON</h2>
                        <button type="button" class="close-modal" aria-label="Close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p class="modal-hint">Paste encounter JSON data</p>
                        <div class="form-group">
                            <textarea id="import-encounter-json-input" rows="10" placeholder='{"title": "My Encounter", "pcs": [{"name": "Fighter"}], "monsters": [{"name": "Goblin", "source": "MM"}], ...}'></textarea>
                        </div>
                        <p id="import-encounter-json-error" class="error-text hidden"></p>
                        <div class="form-actions" style="margin-top: 16px;">
                            <button type="button" id="import-encounter-json-cancel-btn" class="btn">Cancel</button>
                            <button type="button" id="import-encounter-json-confirm-btn" class="btn btn-primary">Import</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Toast Container -->
            <div id="toast-container"></div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
